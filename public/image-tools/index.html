<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>画像編集｜圧縮・変換・トリミング・回転</title><style>body{font-family:system-ui;max-width:760px;margin:30px auto;padding:16px;background:#f7f7f5;color:#202329}.card{background:white;padding:24px;border-radius:14px;border:1px solid #ddd}button,input,select{padding:10px;margin:5px;border:1px solid #ccc;border-radius:6px}button{cursor:pointer}.drop{border:2px dashed #8bb8ae;padding:45px;text-align:center;margin:15px 0}canvas{max-width:100%;display:block;margin:20px auto}.row{display:flex;flex-wrap:wrap;align-items:center;gap:5px}.hint{color:#777;font-size:13px}</style><div class="card"><h1>画像編集ツール</h1><p class="hint">画像はこの端末のブラウザ内だけで処理され、サーバーに保存されません。</p><div class="drop" id="drop">画像をドロップまたは選択<input id="file" type="file" accept="image/*"></div><canvas id="canvas"></canvas><div class="row"><label>形式<select id="format"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label><label>品質<input id="quality" type="range" min="10" max="100" value="85"></label></div><div class="row"><button data-act="left">左回転</button><button data-act="right">右回転</button><button data-act="h">左右反転</button><button data-act="v">上下反転</button><button data-act="crop">中央トリミング</button><button id="save">圧縮・変換して保存</button></div><p class="hint">トリミングは画像の中央を正方形に切り抜きます。品質を下げると容量を削減できます。</p></div><script>const f=document.querySelector('#file'),d=document.querySelector('#drop'),c=document.querySelector('#canvas'),x=c.getContext('2d');let im=new Image(),angle=0,fx=1,fy=1;function load(file){if(!file)return;im.onload=()=>{c.width=im.width;c.height=im.height;draw()};im.src=URL.createObjectURL(file)}function draw(){x.save();x.clearRect(0,0,c.width,c.height);x.translate(c.width/2,c.height/2);x.rotate(angle*Math.PI/180);x.scale(fx,fy);x.drawImage(im,-im.width/2,-im.height/2);x.restore()}f.onchange=()=>load(f.files[0]);d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{if(!im.src)return;const a=b.dataset.act;if(a==='left'||a==='right')angle+=(a==='left'?-90:90);if(a==='h')fx*=-1;if(a==='v')fy*=-1;if(a==='crop'){const n=Math.min(c.width,c.height),sx=(c.width-n)/2,sy=(c.height-n)/2,t=document.createElement('canvas');t.width=t.height=n;t.getContext('2d').drawImage(c,sx,sy,n,n,0,0,n,n);im.src=t.toDataURL();im.onload=()=>{c.width=c.height=n;draw()}}draw()});document.querySelector('#save').onclick=()=>{if(!im.src)return;const a=document.createElement('a');a.href=c.toDataURL(document.querySelector('#format').value,+document.querySelector('#quality').value/100);a.download='toolbox-edited.'+document.querySelector('#format').value.split('/')[1].replace('jpeg','jpg');a.click()}</script></html>
